name: Deploy

# Separate from ci.yml: this is the only workflow that carries the Cloudflare
# secrets, so third-party audit tools (Lighthouse, axe, etc.) in ci.yml's jobs
# never run in a job that has them.
#
# Splits a build job (no secrets, caches allowed) from a deploy job (the only
# place the token lives). The deploy job doesn't share a VM with
# Astro/Vite/Tailwind/Mermaid/Chromium, project dependencies, install
# scripts, or any cache ci.yml writes to. It checks out only wrangler.jsonc,
# the root package.json (packageManager, for pinning pnpm itself — nothing
# else in it), and .github/deploy/ (a dedicated, integrity-pinned package.json
# + pnpm-lock.yaml for wrangler and its full dependency tree — never the
# project's own pnpm-lock.yaml; see preview-deploy's install step for why),
# installs with lifecycle scripts off, and takes dist/ as an artifact.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Distinctive ids: "build" and "check" already exist in ci.yml, and
  # required status checks are matched by check-run name, which defaults to
  # the job id when a job has no `name:`.
  preview-build:
    # Same-repo PRs only — a fork's workflow content never runs with the
    # Cloudflare secrets (the deploy job's token isn't reachable from this
    # job at all, but the artifact it produces is, so gate here too).
    #
    # Dependabot PRs pass the same-repo check (its branches live in this
    # repo), but GitHub gives a Dependabot-triggered run only Dependabot
    # secrets — none exist for this repo — and a read-only GITHUB_TOKEN, so
    # a Dependabot run could never authenticate to Cloudflare anyway. Skip
    # it explicitly instead of letting it fail: a skipped job reports
    # Success, so it doesn't block a security-update PR the way a failed
    # required check would. Re-running an existing run keeps the actor who
    # triggered it (GitHub's own re-run docs); only a new push by Dave, a
    # different actor, changes github.actor and lets the job run for real.
    # https://docs.github.com/en/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Cancel an older build for the same PR the moment a newer one starts,
    # so an older run's build can't finish after a newer one and trigger a
    # stale deploy. preview-deploy's own staleness check is the backstop for
    # the remaining race (an older run's build already finished before this
    # existed, or the two builds landed too close together for cancellation
    # to catch).
    concurrency:
      group: preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mermaid diagrams render in headless Chromium at build, same as ci.yml.
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      # No PUBLIC_CF_WEB_ANALYTICS_TOKEN here, intentionally: previews must
      # not carry the production analytics beacon. astro:env leaves it
      # undefined when unset, so the build just ships without it (the
      # production build job is the only one that sets it).
      - run: pnpm build
      # No secrets in this job, so a drift here can't leak anything — but it
      # can silently make preview-deploy install a stale wrangler if nobody
      # remembers to update .github/deploy/ after bumping the project's own
      # pin. Catch that here instead.
      - name: Confirm .github/deploy/'s wrangler pin matches the project's
        run: |
          set -eu
          deploy_version="$(node -p "require('./.github/deploy/package.json').devDependencies.wrangler")"
          project_version="$(pnpm list wrangler --json | jq -r '.[0].devDependencies.wrangler.version')"
          if [ "$deploy_version" != "$project_version" ]; then
            echo "::error::.github/deploy/package.json pins wrangler@$deploy_version but pnpm-lock.yaml resolves wrangler@$project_version. Update .github/deploy/package.json and run 'pnpm run deploy-tool:lock' to regenerate .github/deploy/pnpm-lock.yaml to match."
            exit 1
          fi
      # Node's own built-in test runner, not vitest — this tests deploy
      # tooling, not the site, and needs no project dependency to do it.
      # Covers, among other cases, a string value containing ",}" or ",]"
      # surviving route-guard.mjs's JSONC stripping unchanged: an earlier
      # version corrected trailing commas with one regex pass over the
      # whole flattened output, which could reach into a string's own
      # value and corrupt it.
      - run: node --test .github/deploy/route-guard.test.mjs
      # No job output carries anything from here to preview-deploy besides
      # this artifact — deliberately. This job runs pnpm install (with
      # allowBuilds scripts), Astro, Vite, Tailwind, sharp, and everything
      # else `pnpm build` pulls in; any of that could write to $GITHUB_OUTPUT
      # itself (a job output is just a line appended to a file any process
      # in the job can reach, on a hosted runner with passwordless sudo).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-dist
          path: dist/
          retention-days: 1

  preview-deploy:
    needs: preview-build
    # A skipped `needs` job already skips this one by default (no explicit
    # `if` required for that). Repeating the same-repo/Dependabot condition
    # here anyway is deliberate belt-and-suspenders: this job, not
    # preview-build, is the one that actually holds the Cloudflare token, so
    # its own gate shouldn't depend on nobody ever adding `if: always()` (or
    # similar) to loosen it later.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # wrangler.jsonc, for wrangler to read; .github/deploy/ (wrangler's own
      # dedicated, integrity-pinned install) — see the top-of-file comment
      # and the install step below; and the root package.json, whose
      # packageManager field is all pnpm/action-setup below reads (no other
      # field in it is used — the project's own dependencies are never
      # installed here). No project code, no source.
      # persist-credentials: false, since nothing after this needs git auth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            wrangler.jsonc
            /package.json
            .github/deploy
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # First and cheap, before downloading the artifact or installing
      # anything: if a newer run now exists for this PR, this run's deploy
      # would either race it or, worse, finish after it and overwrite newer
      # code with older code. gh reads with the job's own read-only
      # GITHUB_TOKEN — no elevated permissions needed for a public repo's PR
      # metadata.
      - name: Refuse to deploy a superseded commit
        id: staleness
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THIS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$current_sha" != "$THIS_SHA" ]; then
            echo "::notice::PR #$PR_NUMBER's head is now $current_sha, not this run's $THIS_SHA. A newer run covers it; skipping this deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.staleness.outputs.stale != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-dist
          path: dist/
      # The artifact only ever lands in dist/ (the `path:` above), and
      # wrangler reads dotenv files from the working directory, not from
      # dist/ — but assert it anyway, in case a future change moves where
      # the artifact unpacks, or a crafted artifact tries a path trick.
      - if: steps.staleness.outputs.stale != 'true'
        name: Refuse a stray dotenv-like file at the job root
        run: |
          set -eu
          shopt -s nullglob
          stray=(.env* .dev.vars*)
          shopt -u nullglob
          if [ "${#stray[@]}" -gt 0 ]; then
            echo "::error::Unexpected dotenv-like file(s) before wrangler runs: ${stray[*]}"
            exit 1
          fi
      # Fails closed on any parse problem, and on a top-level route/routes
      # key. See .github/deploy/route-guard.mjs for why this isn't sed+jq.
      - if: steps.staleness.outputs.stale != 'true'
        run: node .github/deploy/route-guard.mjs wrangler.jsonc website
      # Reads the version to install from the root package.json's
      # packageManager field (sparse-checked-out above) — no `version:`
      # input, so this can never drift from what the project itself pins.
      # cache defaults to false: no store cache, same as the rest of this
      # job. Same major (v6) as ./.github/actions/setup, SHA-pinned like
      # every other action this workflow uses.
      - if: steps.staleness.outputs.stale != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.staleness.outputs.stale != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Not ./.github/actions/setup, and not the project's own
      # pnpm-lock.yaml: those install (or resolve versions from) the whole
      # project — Astro, Vite, Tailwind, sharp, mermaid-isomorphic,
      # Playwright — none of which this job needs, and all of which would
      # sit on disk next to the Cloudflare token. .github/deploy/ pins
      # *only* wrangler and its own dependency tree, with pnpm's own
      # integrity hashes for every resolved package, not just wrangler
      # itself — --frozen-lockfile refuses to install anything that doesn't
      # match the committed lockfile exactly, and refuses to touch the
      # lockfile itself. --ignore-scripts skips lifecycle scripts for the
      # whole tree. --ignore-workspace: this directory has its own
      # package.json and pnpm-lock.yaml deliberately outside the project's
      # pnpm-workspace.yaml (which isn't even checked out here) — belt and
      # suspenders against ever resolving against the project's own
      # workspace instead. --registry pins where packages come from
      # explicitly, so no .npmrc this checkout doesn't even carry (and none
      # is committed anywhere in this repo) could redirect it.
      - if: steps.staleness.outputs.stale != 'true'
        name: Install wrangler and its locked dependency tree, scripts off
        run: |
          set -eu
          pnpm --dir .github/deploy install --frozen-lockfile --ignore-scripts --ignore-workspace --registry=https://registry.npmjs.org/
      # Confirms the resolved Worker name before deploying anything, using
      # wrangler's own --dry-run resolution (which correctly derives
      # "website" for the default target) rather than re-deriving it here.
      # A wrong name here — for example if wrangler.jsonc were ever renamed
      # to "website-production" at the top level — would otherwise let this
      # --env="" upload target the production Worker.
      - if: steps.staleness.outputs.stale != 'true'
        name: Confirm the resolved Worker name
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-name-check.ndjson
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
        run: |
          set -eu
          pnpm --dir .github/deploy exec wrangler versions upload --env="" --dry-run >/dev/null
          name=$(jq -r 'select(.type == "version-upload") | .worker_name // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          if [ "$name" != "website" ]; then
            echo "::error::Resolved Worker name is '$name', expected 'website'. Refusing to deploy."
            exit 1
          fi
      - if: steps.staleness.outputs.stale != 'true'
        name: Deploy preview
        id: deploy
        env:
          # Scoped to this step only: it's the one step in the job that
          # needs them.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Explicit, so a .env/.env.local file can't redirect wrangler's API
          # calls: wrangler fills a variable from a dotenv file only when
          # it's not already set in the process environment, and it loads
          # dotenv files from the working directory on every command.
          # Verified against wrangler 4.136.3: with this unset, a
          # CLOUDFLARE_API_BASE_URL in .env.local silently redirects
          # `whoami`'s request; with it set here, the request goes to the
          # real API regardless of what's on disk.
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu

          # --env="" targets the top-level (default/staging) config and
          # silences Wrangler's "multiple environments configured, but none
          # specified" warning — env.production exists in wrangler.jsonc, so
          # this otherwise logs on every PR. Verified with
          # `wrangler versions upload --dry-run`: no warning, exit 0.
          # https://developers.cloudflare.com/workers/wrangler/commands/#versions-upload
          #
          # This uploads a new *version*; it doesn't turn on workers_dev or
          # preview_urls, and it doesn't create the Worker if it doesn't
          # exist yet (`versions upload` requires the Worker exists — see
          # the PR body's merge preconditions). Only `wrangler deploy` (the
          # staging job) or the Cloudflare dashboard change those settings.
          #
          # Alias rules (developers.cloudflare.com/workers/configuration/previews):
          # lowercase letters/numbers/dashes, must start with a letter, and
          # "<alias>-<worker-name>" together must be <= 63 chars (DNS label
          # limit). "pr-<number>" is always a handful of characters, well
          # under the limit combined with the "website" worker name.
          pnpm --dir .github/deploy exec wrangler versions upload --env="" --preview-alias "pr-$PR_NUMBER"

          # Read the alias URL from Wrangler's own ND-JSON output file, not
          # from wrangler-action's outputs (it has none for this — see the
          # PR body). Confirmed the field name against the installed
          # wrangler@4.136.3 source (node_modules/wrangler/wrangler-dist/cli.js):
          # a `{"type":"version-upload", ..., "preview_alias_url": "..."}`
          # record, populated only once the target Worker has Version
          # Preview URLs enabled server-side. `--dry-run` omits both URL
          # fields (no upload happens, so there's no version to preview) —
          # this line runs unverified until a real Cloudflare account
          # exists; see the live-checks list in the PR body.
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          if [ -z "$url" ]; then
            echo "::error::wrangler versions upload did not report a preview_alias_url in WRANGLER_OUTPUT_FILE_PATH"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
