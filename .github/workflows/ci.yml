name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  structured-data:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Validates already-built HTML; doesn't render Mermaid, so no Chromium.
      - uses: ./.github/actions/setup
        with:
          browser: "false"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The schema.org vocabulary is vendored (scripts/vendor/), not
      # downloaded, so there's nothing here to cache.
      - run: pnpm validate:structured-data

  a11y:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs axe in real Chromium against the built pages, so (unlike
      # structured-data) this job needs the browser the setup action installs
      # by default.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm test:a11y
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: reports/a11y/
          retention-days: 14

  perf:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Lighthouse runs on the same Chromium the setup action installs by
      # default (lighthouserc.cjs points chromePath at it) rather than a
      # second, separately-installed Chrome — verified locally; CI is what
      # confirms it holds on ubuntu-latest's Linux binary too.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm test:perf
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lhci-report
          path: reports/lhci/
          retention-days: 14
