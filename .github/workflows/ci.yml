name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  structured-data:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Validates already-built HTML; doesn't render Mermaid, so no Chromium.
      - uses: ./.github/actions/setup
        with:
          browser: "false"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The schema.org vocabulary is vendored (scripts/vendor/), not
      # downloaded, so there's nothing here to cache.
      - run: pnpm validate:structured-data
