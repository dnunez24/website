name: Setup
description: Install pnpm, Node.js and dependencies, and optionally install Playwright Chromium.

inputs:
  browser:
    description: Install the Playwright Chromium browser that the browser tests and accessibility checks drive.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Installs the version pinned by packageManager in package.json, same as local.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Browser tests and the axe accessibility check drive headless Chromium.
    - if: inputs.browser == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: inputs.browser == 'true'
      run: pnpm test:browser --with-deps
      shell: bash
